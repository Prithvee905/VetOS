services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vetos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-role.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetos"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Optional S3-compatible storage (not required for local dev; API uses ./.vetos-blobs).
  # Start with: docker compose --profile s3 up --build
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vetos
      SPRING_DATASOURCE_USERNAME: vetos_app
      SPRING_DATASOURCE_PASSWORD: vetos_app
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/vetos
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      VETOS_JWT_SECRET: dev-only-change-me-not-for-production-0001
      VETOS_PLATFORM_ADMIN_SECRET: dev-platform-admin-secret-0001
      VETOS_JWT_ACCESS_TTL: PT24H
      VETOS_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      VETOS_STORAGE_TYPE: local
      # WhatsApp (Meta Cloud API) — set for real customer messages:
      # META_WHATSAPP_TOKEN: ""
      # META_WHATSAPP_PHONE_NUMBER_ID: ""
      # VETOS_WHATSAPP_VERIFY_TOKEN: "vetos-meta-verify-token-2026"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./apps/web
    environment:
      API_ORIGIN: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  minio_data:
