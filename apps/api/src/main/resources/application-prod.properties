# ==============================================================================
# ClinicOS / VetOS — Spring Boot Production Profile Configuration (prod)
# ==============================================================================

# Cookie & Security Hardening (Set to true only when HTTPS with SSL certificate is enabled)
vetos.security.cookie-secure=${VETOS_SECURITY_COOKIE_SECURE:false}
vetos.cors.allowed-origin=${VETOS_CORS_ALLOWED_ORIGIN:https://clinic.example.com}

# Disable SQL verbose logging in production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator Health Probes (Strictly only health, no sensitive endpoints)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# HikariCP Connection Pool Tuning for Single EC2 (t4g.large / t3.large, 8 GB RAM)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=VetOSHikariProdPool

# Storage & Blobs
vetos.storage.type=${VETOS_STORAGE_TYPE:local}
vetos.storage.local-base-path=${VETOS_STORAGE_LOCAL_BASE_PATH:/data/blobs}

# Meta WhatsApp Cloud API (see docs/whatsapp-production-setup.md)
vetos.whatsapp.api-base-url=${VETOS_WHATSAPP_API_BASE_URL:https://graph.facebook.com/v23.0/${META_WHATSAPP_PHONE_NUMBER_ID}/messages}
vetos.whatsapp.verify-token=${VETOS_WHATSAPP_VERIFY_TOKEN:}
vetos.whatsapp.access-token=${META_WHATSAPP_TOKEN:${VETOS_WHATSAPP_ACCESS_TOKEN:}}
