spring.application.name=vetos-api
spring.datasource.url=jdbc:postgresql://localhost:5432/vetos
spring.datasource.username=vetos_app
spring.datasource.password=vetos_app
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

vetos.jwt.secret=${VETOS_JWT_SECRET:dev-only-change-me-not-for-production-0001}
vetos.jwt.access-ttl=${VETOS_JWT_ACCESS_TTL:PT24H}
vetos.jwt.refresh-ttl=P14D
vetos.security.cookie-secure=false
vetos.cors.allowed-origin=http://localhost:3000
vetos.workers.enabled=true
vetos.storage.type=local
vetos.storage.local-base-path=./.vetos-blobs
vetos.storage.s3-bucket=
vetos.storage.s3-region=us-east-1
vetos.storage.s3-endpoint=
vetos.storage.s3-access-key=
vetos.storage.s3-secret-key=
vetos.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
vetos.whatsapp.api-base-url=${VETOS_WHATSAPP_API_BASE_URL:https://graph.facebook.com/v23.0/${META_WHATSAPP_PHONE_NUMBER_ID:937272686146289}/messages}
vetos.whatsapp.verify-token=${VETOS_WHATSAPP_VERIFY_TOKEN:vetos-meta-verify-token-2026}
vetos.whatsapp.access-token=${META_WHATSAPP_TOKEN:${VETOS_WHATSAPP_ACCESS_TOKEN:}}
vetos.email.api-base-url=
vetos.email.from-address=noreply@clinic.local
vetos.email.api-key=
vetos.platform.admin-secret=${VETOS_PLATFORM_ADMIN_SECRET:vetos-platform-admin-secret-change-me}
spring.servlet.multipart.max-file-size=25MB
