spring.application.name=vetos-api
spring.datasource.url=jdbc:postgresql://localhost:5432/vetos
spring.datasource.username=vetos_app
spring.datasource.password=vetos_app
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

vetos.jwt.secret=${VETOS_JWT_SECRET:dev-only-change-me-not-for-production-0001}
vetos.jwt.access-ttl=PT15M
vetos.jwt.refresh-ttl=P14D
vetos.security.cookie-secure=false
vetos.cors.allowed-origin=http://localhost:3000
vetos.workers.enabled=true
vetos.storage.type=local
vetos.storage.local-base-path=./.vetos-blobs
vetos.whatsapp.api-base-url=
vetos.whatsapp.verify-token=
vetos.whatsapp.access-token=
vetos.email.api-base-url=
vetos.email.from-address=noreply@clinic.local
vetos.email.api-key=
spring.servlet.multipart.max-file-size=25MB
